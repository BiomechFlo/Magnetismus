<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnetismus – Lerngang NT 8</title>
<!-- Lerngang Magnetismus, Natur und Technik 8, Mittelschule Bayern.
     Eine Datei, keine externen Quellen, keine Datenübertragung.
     Stand: Phase 2 (Kern-Lerngang R8). Die M-Module sind angelegt, ihre Inhalte folgen in Phase 3. -->
<style>
/* ===== Grundfarben und Schrift ===== */
:root{
  --bg:#f5f3ee; --karte:#ffffff; --ink:#1d2733; --mut:#566270; --linie:#d3d8de;
  --acc:#1f5fa8; --accbg:#e6eff9; --ok:#1b6e37; --okbg:#e2f3e7; --no:#a8231c; --nobg:#fbe8e6;
  --stern:#7a4f00; --sternbg:#fff1cf; --N:#c62828; --S:#2e7d32;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:19px;line-height:1.55}
h1{font-size:1.15rem;margin:0}
h2{font-size:1.5rem;line-height:1.25;margin:0 0 .4rem}
h3{font-size:1.15rem;margin:0 0 .5rem}
p{margin:0 0 .7rem}
p:last-child{margin-bottom:0}
strong{font-weight:700}
[hidden]{display:none !important}

/* ===== Kopf mit Fortschritt und Stationsleiste ===== */
.kopf{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--linie)}
.kopf-in{display:flex;align-items:center;gap:1rem;padding:.4rem 1rem;max-width:920px;margin:0 auto}
.fortschritt{flex:1;display:flex;align-items:center;gap:.6rem;font-size:.85rem;color:var(--mut)}
.balken{flex:1;height:10px;background:#e6e9ed;border-radius:5px;overflow:hidden;min-width:60px}
#balkenfuell{height:100%;width:0;background:var(--ok);transition:width .3s}
#nav{display:flex;gap:.35rem;overflow-x:auto;padding:.3rem 1rem .5rem;max-width:920px;margin:0 auto;-webkit-overflow-scrolling:touch}
.nav-b{flex:0 0 auto;min-width:48px;height:48px;border-radius:24px;border:2px solid var(--linie);background:#fff;
  font:inherit;font-weight:700;color:var(--ink);cursor:pointer;padding:0 .5rem}
.nav-b.fertig{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.nav-b.aktuell{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.nav-b:disabled{opacity:.45;cursor:not-allowed}

/* ===== Inhalt ===== */
main{max-width:920px;margin:0 auto;padding:1rem}
.karte{background:var(--karte);border:1px solid var(--linie);border-radius:14px;padding:1rem 1.1rem;margin:0 0 1rem;position:relative}
.stkopf{margin-bottom:1rem}
.stnr{color:var(--mut);font-weight:700;font-size:.95rem;letter-spacing:.02em}
.ziel{background:var(--accbg);border-left:6px solid var(--acc);border-radius:10px;padding:.7rem .9rem;margin:.6rem 0}
.ziel b{display:block;font-size:.85rem;color:var(--acc);text-transform:uppercase;letter-spacing:.04em}
.werkzeug{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}
.merke{background:#fff8e1;border-color:#e3c770}
.merke h3{color:#6b4e00}
.versuch{background:#eef7f0;border-color:#9cc9a8}
.sicher{background:var(--nobg);border-left:6px solid var(--no);border-radius:8px;padding:.5rem .8rem;margin-top:.6rem;font-weight:600}
.kopfzeile{display:flex;align-items:flex-start;gap:.5rem;justify-content:space-between;margin-bottom:.4rem}
.kopfzeile h3{margin:0}

/* ===== Schaltflächen ===== */
.btn{min-height:48px;padding:.5rem 1rem;border-radius:10px;border:2px solid var(--acc);background:var(--acc);color:#fff;
  font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}
.btn.hell{background:#fff;color:var(--acc)}
.btn.grau{background:#fff;color:var(--ink);border-color:var(--linie)}
.btn.gewaehlt{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.nav-b:focus-visible,.opt:focus-visible,.chip:focus-visible,.fach:focus-visible{outline:3px solid #f0a500;outline-offset:2px}
.lesen{display:none;flex:0 0 auto;min-width:48px;min-height:48px;border-radius:24px;border:2px solid var(--linie);background:#fff;font-size:1.2rem;cursor:pointer}
.mit-vorlesen .lesen{display:inline-flex;align-items:center;justify-content:center}
.lesen.aktiv{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ===== Aufgaben ===== */
.marke{display:inline-block;font-size:.8rem;font-weight:700;border-radius:6px;padding:.1rem .5rem;margin-right:.4rem;vertical-align:middle}
.marke.basis{background:var(--accbg);color:var(--acc)}
.marke.frei{background:#eceff2;color:var(--mut)}
.marke.stern,.marke.vert{background:var(--sternbg);color:var(--stern)}
.marke.m{background:#ede4f7;color:#5b2a91}
.marke.verm{background:#e9f3f1;color:#17594e}
.marke.geloest{background:var(--okbg);color:var(--ok)}
.aufgabe.fertig{border-color:var(--ok)}
.frage{font-weight:600}
.optionen{display:grid;gap:.5rem;margin:.6rem 0}
.opt{min-height:48px;text-align:left;padding:.55rem .9rem;border-radius:10px;border:2px solid var(--linie);background:#fff;
  font:inherit;color:var(--ink);cursor:pointer;touch-action:manipulation}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg)}
.opt.gemerkt{border-color:var(--acc);background:var(--accbg)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{border-radius:10px;padding:.6rem .8rem;margin-top:.6rem}
.fb:empty{display:none}
.fb.ok{background:var(--okbg);border-left:6px solid var(--ok)}
.fb.no{background:var(--nobg);border-left:6px solid var(--no)}
.fb.neutral{background:var(--accbg);border-left:6px solid var(--acc)}
.hilfen{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.7rem}
.hilfetext{flex:1 0 100%;background:#f3f0fa;border-left:6px solid #6a4bb3;border-radius:8px;padding:.5rem .8rem}
textarea,input[type=text],select{font:inherit;color:var(--ink);border:2px solid var(--linie);border-radius:10px;padding:.5rem .7rem;background:#fff}
textarea{width:100%;min-height:6.5rem;resize:vertical;margin:.5rem 0}
input[type=text]{width:8rem;min-height:48px}
select{min-height:48px}
.zahlzeile{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin:.6rem 0}
details.anfaenge{margin:.4rem 0}
details.anfaenge summary{min-height:48px;display:flex;align-items:center;cursor:pointer;color:var(--acc);font-weight:600}
.anf-liste{display:flex;flex-wrap:wrap;gap:.5rem}
.muster{background:#f4f6f8;border-radius:10px;padding:.7rem .9rem;margin-top:.6rem}
.kleintitel{font-size:.85rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}

/* Sortieren und Beschriften */
.vorrat{display:flex;flex-wrap:wrap;gap:.5rem;min-height:56px;padding:.5rem;border:2px dashed var(--linie);border-radius:10px;margin:.6rem 0}
.chip{min-height:48px;padding:.4rem .8rem;border-radius:10px;border:2px solid var(--ink);background:#fff;font:inherit;color:var(--ink);
  cursor:grab;touch-action:none;position:relative;user-select:none;-webkit-user-select:none}
.chip.gewaehlt{background:var(--accbg);border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.chip.zieht{z-index:50;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:grabbing}
.chip.ok{border-color:var(--ok);background:var(--okbg);cursor:default;pointer-events:none;touch-action:auto}
.faecher{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.6rem}
.fach{border:2px solid var(--linie);border-radius:10px;padding:.5rem;min-height:110px;background:#fafbfc;cursor:pointer}
.fachname{font-weight:700;margin-bottom:.4rem}
.fachin{display:flex;flex-wrap:wrap;gap:.4rem}
.faecher.slots .fach{min-height:76px}
.tipp{font-size:.9rem;color:var(--mut)}

/* ===== Simulationen ===== */
.sim-canvas{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--linie);border-radius:10px;touch-action:pan-y}
.sim-canvas.zieh{touch-action:none;cursor:grab}
.sim-leiste{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.6rem}
.sim-text{margin-top:.6rem;background:#f4f6f8;border-radius:10px;padding:.6rem .8rem;min-height:3rem}
.regler{display:flex;flex-direction:column;flex:1 1 220px;font-weight:600}
.regler input[type=range]{width:100%;height:48px;touch-action:pan-y;accent-color:var(--acc)}
.wahl{display:flex;flex-direction:column;font-weight:600;font-size:.95rem}
.gesperrt{background:#f4f6f8;border:2px dashed var(--linie);border-radius:10px;padding:1rem;color:var(--mut);text-align:center}

/* ===== Abschluss einer Station ===== */
.abschluss{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem;justify-content:space-between}
.geschafft{text-align:center;border:3px solid var(--ok);padding:1.5rem 1.2rem}
.geschafft .haken{width:84px;height:84px;border-radius:42px;background:var(--ok);color:#fff;font-size:3rem;line-height:84px;margin:0 auto .6rem}
.geschafft table{margin:1rem auto;border-collapse:collapse;text-align:left}
.geschafft td{padding:.3rem .8rem;border-bottom:1px solid var(--linie)}
.geschafft td:last-child{font-weight:700}
.geschafft .btnzeile{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1rem}

/* ===== Wortspeicher, Glossar, Selbsteinschätzung ===== */
.wort{display:flex;gap:.8rem;align-items:flex-start;padding:.6rem 0;border-bottom:1px solid var(--linie)}
.wort:last-child{border-bottom:0}
.wort svg{flex:0 0 96px;width:96px;height:48px}
.wort b{display:block}
.selbst-zeile{padding:.6rem 0;border-bottom:1px solid var(--linie)}
.selbst-zeile:last-child{border-bottom:0}
.selbst-knoepfe{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.4rem}

/* ===== Fuß und Dialog ===== */
.fuss{max-width:920px;margin:1rem auto 2rem;padding:0 1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.zahnrad{width:48px;height:48px;border:0;background:transparent;color:#aab2bb;font-size:1.3rem;cursor:pointer;border-radius:24px}
#overlay{position:fixed;inset:0;z-index:100;background:rgba(20,28,38,.55);display:flex;align-items:flex-start;justify-content:center;
  padding:1rem;overflow-y:auto;-webkit-overflow-scrolling:touch}
.dialog{background:#fff;border-radius:14px;max-width:680px;width:100%;padding:1rem 1.1rem;margin:auto 0}
.dialog-kopf{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.6rem}
.dialog-kopf h2{margin:0;font-size:1.3rem}
.schalter{display:flex;align-items:center;gap:.7rem;min-height:48px;cursor:pointer}
.schalter input{width:26px;height:26px;flex:0 0 auto}
.linkfeld{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;min-height:48px}
fieldset{border:1px solid var(--linie);border-radius:10px;margin:0 0 .8rem;padding:.5rem .8rem}
legend{font-weight:700;padding:0 .3rem}

@media (max-width:600px){body{font-size:18px} main{padding:.7rem} .kopf-in h1{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;scroll-behavior:auto !important}}

</style>
</head>

    <div class="fortschritt"><div class="balken"><div id="balkenfuell"></div></div><span id="fortText"></span></div>
  </div>

</header>
<main id="main"><noscript><p>Für diesen Lerngang muss JavaScript im Browser eingeschaltet sein.</p></noscript></main>

  /* Mini-Skizzen für den Wortspeicher (SVG, 120 x 60) */

  /* =================================================================
     STATIONEN

  stationen: [

  /* ---------------- Station 0: Einstieg ---------------- */
